<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christian Sangati YouTube Player</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
  #player { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
/*
  Christian Sangati — YouTube proxy player.
  Why this page exists: the iOS app runs inside Capacitor/WKWebView from a
  custom "capacitor://localhost" origin. WKWebView sends no valid http(s)
  Referer from that origin, and YouTube's embed endpoint (since July 2025)
  rejects embeds without one — Error 153 "Video player configuration error".
  This page is served over real https, so the Referer it sends to YouTube is
  a valid https URL and the player is accepted. The app loads this page in
  its hidden audio iframe (iOS only) instead of youtube.com directly.
  It is a transparent relay: the app posts the same {event:"command", func,
  args} messages it already sends to a YouTube iframe, and this page calls
  the matching YT.Player method; player state/time come back to the app in
  the same {event:"onStateChange"|"infoDelivery"|"onError", info} shape the
  app already handles. Android keeps the direct youtube.com embed.
  Query: ?v=VIDEO_ID&t=START_SECONDS
*/
(function(){
  var qs = new URLSearchParams(window.location.search);
  var videoId = qs.get("v") || "";
  var start = parseInt(qs.get("t") || "0", 10) || 0;

  var player = null;
  var ready = false;
  var queued = []; /* commands that arrive before the player is ready */
  var pollTimer = null;

  function postToApp(msg){
    try { window.parent.postMessage(JSON.stringify(msg), "*"); } catch (e) {}
  }
  function sendTime(){
    if (!player || !ready) return;
    try {
      postToApp({ event: "infoDelivery", info: {
        currentTime: player.getCurrentTime(),
        duration: player.getDuration()
      }});
    } catch (e) {}
  }
  function startPolling(){
    if (pollTimer) return;
    pollTimer = setInterval(function(){
      if (player && ready){
        try {
          var st = player.getPlayerState();
          if (st === 1) sendTime(); /* only while playing */
        } catch (e) {}
      }
    }, 500);
  }
  function runCommand(func, args){
    if (!player || !ready){ queued.push([func, args]); return; }
    try {
      if (func === "playVideo") player.playVideo();
      else if (func === "pauseVideo") player.pauseVideo();
      else if (func === "stopVideo") player.stopVideo();
      else if (func === "seekTo" && args && args.length){
        player.seekTo(args[0], args.length > 1 ? args[1] : true);
      }
    } catch (e) {}
  }
  window.addEventListener("message", function(ev){
    var d = null;
    try { d = (typeof ev.data === "string") ? JSON.parse(ev.data) : ev.data; } catch (e) { return; }
    if (!d || d.event !== "command" || !d.func) return;
    runCommand(d.func, d.args || "");
  });

  function onReady(){
    ready = true;
    postToApp({ event: "onReady", info: 1 });
    var q = queued; queued = [];
    for (var i = 0; i < q.length; i++) runCommand(q[i][0], q[i][1]);
    try { player.playVideo(); } catch (e) {}
    startPolling();
  }
  function onStateChange(ev){
    var s = ev.data;
    postToApp({ event: "onStateChange", info: s });
    if (s === 1) sendTime();
    if (s === 1) startPolling();
  }
  function onError(ev){
    var code = (ev && ev.data !== undefined) ? ev.data : "?";
    postToApp({ event: "onError", info: code });
  }

  var tag = document.createElement("script");
  tag.src = "https://www.youtube.com/iframe_api";
  tag.onerror = function(){ postToApp({ event: "onError", info: "api-load" }); };
  document.head.appendChild(tag);

  window.onYouTubeIframeAPIReady = function(){
    if (!videoId){ postToApp({ event: "onError", info: "no-video" }); return; }
    player = new YT.Player("player", {
      videoId: videoId,
      playerVars: {
        autoplay: 1,
        start: start,
        controls: 0,
        disablekb: 1,
        fs: 0,
        rel: 0,
        playsinline: 1,
        origin: window.location.origin
      },
      events: { onReady: onReady, onStateChange: onStateChange, onError: onError }
    });
  };
})();
</script>
</body>
</html>
